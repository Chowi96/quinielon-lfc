*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#07090d,#0d131b);color:var(--text);font-family:Inter,Arial,sans-serif}button,input,select{font:inherit}
.wrap{max-width:1180px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:16px;margin-bottom:18px}.logo{width:62px;height:62px;object-fit:contain;border-radius:12px;background:#fff}.brand h1{margin:0;font-size:28px;letter-spacing:.5px}.brand p{margin:3px 0;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab,.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 14px;border-radius:10px;cursor:pointer}.tab.active,.btn.primary{background:var(--accent);border-color:var(--accent)}.btn.blue{background:var(--accent2);border-color:var(--accent2)}.btn.green{background:var(--ok);border-color:var(--ok);color:#06100a}.btn.danger{background:#35121a;border-color:#7f2035}.btn:disabled{opacity:.45;cursor:not-allowed}

/* --- LFC visual refresh --- */
:root{--bg:#04101d;--card:#0c1c2b;--card2:#102438;--line:#20394f;--text:#f5f8ff;--muted:#a6bfd4;--accent:#e20b3b;--accent2:#087cff;--ok:#25d366;--warn:#ffca45}
html{min-height:100%;background:#04101d}
body{min-height:100vh;background:radial-gradient(ellipse at 78% 2%,rgba(14,75,148,.36),transparent 32%),radial-gradient(ellipse at 12% 70%,rgba(10,52,94,.28),transparent 36%),linear-gradient(135deg,#020812 0%,#071827 48%,#030b15 100%);color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif;letter-spacing:.05px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background:linear-gradient(180deg,transparent 65%,rgba(14,79,133,.2)),repeating-linear-gradient(115deg,transparent 0 70px,rgba(74,145,203,.035) 71px 72px);z-index:-1}
.wrap{max-width:1440px;margin:auto;padding:22px 26px 34px}
.top{position:relative;display:flex;align-items:center;gap:18px;padding:8px 4px 22px;margin-bottom:16px;border-bottom:1px solid rgba(84,137,180,.22)}
.logo{width:56px;height:56px;border-radius:50%;background:linear-gradient(145deg,#f9fbff,#b9d6ee);box-shadow:0 0 25px #1677ff24;color:#061526}
.brand h1{margin:0;font-size:clamp(25px,3vw,37px);line-height:1.08;font-weight:950;letter-spacing:-1.1px;text-transform:uppercase;text-shadow:0 2px 18px #0007}
.brand h1:after{content:" LFC";color:#f20d40}.brand p{margin:7px 0 0;color:#a9c6e2;font-size:14px;font-style:italic}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px;padding:7px;background:rgba(5,19,33,.76);border:1px solid rgba(68,121,165,.2);border-radius:15px;backdrop-filter:blur(12px)}
.tab,.btn{border:1px solid transparent;background:rgba(19,42,63,.86);color:#eaf4ff;padding:11px 16px;border-radius:10px;cursor:pointer;transition:transform .16s ease,background .16s ease,border-color .16s ease;box-shadow:inset 0 1px 0 #ffffff08}
.tab:hover,.btn:hover{transform:translateY(-1px);border-color:#3a6d9c;background:#193b5b}.tab.active,.btn.primary{background:linear-gradient(135deg,#ef1744,#c90832);border-color:#fa3a60;box-shadow:0 7px 20px #e20b3b25;font-weight:750}.btn.blue{background:linear-gradient(135deg,#168cff,#0756d8);border-color:#2a9cff}.btn.green{background:linear-gradient(135deg,#35df78,#14a953);border-color:#48e58b;color:#042313}.btn.danger{background:#35121a;border-color:#7f2035}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.card{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(14,32,49,.97),rgba(8,22,36,.97));border:1px solid rgba(74,126,168,.32);border-radius:17px;padding:22px;margin-bottom:17px;box-shadow:0 12px 32px #0002,inset 0 1px 0 #ffffff08}
.card h2,.card h3{letter-spacing:-.35px}.card h2{font-size:25px;margin-top:2px}.card h3{font-size:20px;margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat{padding:17px;background:linear-gradient(145deg,rgba(19,45,67,.9),rgba(10,27,43,.92));border-radius:13px;border:1px solid rgba(73,125,167,.25)}.stat b{display:block;font-size:27px;margin-top:6px;color:#fff;letter-spacing:-.5px}.muted{color:var(--muted)}.small{font-size:13px}.error{color:#ff7897}.ok{color:#42e78c}.warning{color:#ffd36b}
label{display:block;color:#a9c5de;font-size:13px;margin-bottom:7px}input,select{width:100%;background:#061422;color:var(--text);border:1px solid #29465f;border-radius:10px;padding:11px 12px;outline:none;transition:border .15s,box-shadow .15s}input:focus,select:focus{border-color:#168cff;box-shadow:0 0 0 3px #168cff22}input[type=number]{text-align:center}
.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.login{max-width:900px;margin:44px auto}.loginbox{max-width:470px;margin:auto}.hero{text-align:center;padding:40px 30px;background:radial-gradient(ellipse at 50% 0%,#124e82a0,transparent 65%),linear-gradient(145deg,#0d263b,#071523)}.hero h2{font-size:clamp(30px,4vw,44px);margin:10px 0}.hero .ball{font-size:52px;filter:drop-shadow(0 0 16px #168cff50)}
.match{display:grid;grid-template-columns:minmax(170px,1fr) 132px 145px;align-items:center;gap:15px;padding:17px 4px;border-bottom:1px solid rgba(93,143,181,.2)}.match:last-child{border-bottom:0}.teams{font-weight:800;font-size:17px;letter-spacing:-.2px}.kick{font-size:12px;color:#9db9d2;margin-top:5px}.xrow{display:flex;gap:6px}.xrow button{flex:1;min-width:30px;padding:10px 7px;border-radius:9px;border:1px solid #29465f;background:#091a2a;color:#eaf5ff;cursor:pointer;transition:all .15s}.xrow button:hover{border-color:#188dff}.xrow button.sel{background:linear-gradient(135deg,#168cff,#0757d8);border-color:#3ca6ff;font-weight:850;box-shadow:0 4px 13px #087cff30}.score{display:flex;gap:7px;align-items:center}.score input{width:52px;padding:10px 5px;background:#061422;border-color:#31536d}.dash{color:#88a9c5}
.tablewrap{overflow:auto;border-radius:10px}.table{width:100%;border-collapse:collapse;min-width:470px}.table th,.table td{padding:13px 11px;border-bottom:1px solid rgba(93,143,181,.19);text-align:left}.table th{color:#a9c5de;font-size:11px;text-transform:uppercase;letter-spacing:.7px;background:rgba(19,44,65,.55)}.table tbody tr{transition:background .15s}.table tbody tr:hover{background:rgba(29,73,107,.22)}.me{background:linear-gradient(90deg,rgba(235,180,40,.12),rgba(235,180,40,.035));outline:1px solid rgba(255,202,69,.12)}
.badge{display:inline-block;padding:5px 10px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;background:#202b39}.badge.open{background:#103c2a;color:#59f09b;border:1px solid #1e7546}.badge.closed{background:#3a2026;color:#ff9caf;border:1px solid #7e3345}.badge.draft{background:#302b1d;color:#ffd36b;border:1px solid #625126}
.adminmatch{display:grid;grid-template-columns:35px minmax(120px,1fr) minmax(120px,1fr) 190px 100px 100px;gap:9px;align-items:end;margin:11px 0;padding:12px;background:rgba(4,17,29,.5);border:1px solid rgba(70,121,164,.18);border-radius:12px}
.hidden{display:none!important}.right{text-align:right}.center{text-align:center}.toast{position:fixed;right:22px;bottom:22px;background:linear-gradient(145deg,#17354e,#0b1d2d);border:1px solid #376589;padding:15px 19px;border-radius:12px;box-shadow:0 12px 40px #0009;z-index:10;max-width:min(420px,calc(100vw - 32px))}
@media(min-width:1100px){.wrap{padding-left:34px;padding-right:34px}.card{padding:23px}.tabs{gap:10px}.tab{padding:12px 18px}}
@media(max-width:800px){.wrap{padding:13px}.top{gap:12px;padding-bottom:16px}.logo{width:45px;height:45px}.brand h1{font-size:23px}.brand p{font-size:12px}.grid,.grid3{grid-template-columns:1fr}.match{grid-template-columns:1fr;gap:10px;padding:16px 0}.xrow{max-width:230px}.score input{width:60px}.adminmatch{grid-template-columns:1fr 1fr}.formgrid,.formrow{grid-template-columns:1fr}.right{text-align:left}.card{padding:16px}.tabs{padding:5px}.tab{padding:9px 11px;font-size:13px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.home-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.home-hero h2{font-size:clamp(25px,4vw,36px);margin:9px 0 4px;letter-spacing:-.8px}
.home-subtitle{color:#bfd0e1;font-size:14px}
.home-prize{min-width:150px;padding:13px 15px;border:1px solid #45617b;background:rgba(6,19,32,.82);border-radius:14px;backdrop-filter:blur(10px)}
.home-prize b{display:block;font-size:clamp(24px,4vw,34px);color:#ffd34d;letter-spacing:-.8px;margin:3px 0}
.home-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:17px}
.home-metric{background:rgba(9,28,45,.86);border:1px solid #29435a;border-radius:12px;padding:11px 12px;min-width:0}
.home-metric strong{display:block;font-size:17px;color:#fff;margin-bottom:3px}
.home-metric span{font-size:12px;color:#a8bfd3}
.prediction-card{padding:18px}
.prediction-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.prediction-heading h3{margin:0}
.match{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"teams teams" "outcome score";align-items:center;gap:10px 12px;padding:14px 0;border-bottom:1px solid rgba(93,143,181,.18)}
.match:last-of-type{border-bottom:0}
.match-info{grid-area:teams;display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.match-info .teams{font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.match-info .kick{flex-shrink:0;text-align:right;margin:0;white-space:nowrap}
.match-outcome{grid-area:outcome;min-width:0}
.match-score{grid-area:score;justify-content:flex-end}
.xrow{gap:7px;max-width:none}
.xrow button{width:44px;min-width:44px;height:44px;flex:0 0 44px;padding:0;font-size:16px;border-radius:12px;background:#10253a;border-color:#304a62}
.xrow button.sel{background:linear-gradient(135deg,#168cff,#0757d8);border-color:#45aaff;box-shadow:0 4px 13px #087cff30}
.score{gap:6px}
.score input{width:46px;height:42px;font-size:16px;font-weight:750;border-radius:10px;padding:7px 4px}
.save-bar{position:sticky;bottom:8px;padding-top:12px;background:linear-gradient(180deg,transparent,rgba(6,16,28,.96) 25%);z-index:4}
.save-bar .btn{width:100%;min-height:50px;font-size:16px;box-shadow:0 9px 24px #e20b3b35}
.grid,.grid3{gap:14px}
.stat{border-radius:14px}
.tablewrap{max-width:100%;-webkit-overflow-scrolling:touch}
.table{min-width:490px}

@media(min-width:760px){

 .app-top{margin-bottom:14px}
 .brand-banner{width:min(510px,45vw)}

 .match-score{justify-self:end}

}
@media(max-width:560px){
 .wrap{padding:9px 10px calc(92px + env(safe-area-inset-bottom))}
 .app-top{padding:0;margin:0 0 10px;justify-content:center}
 .brand-banner{width:100%;max-height:none;max-width:560px;border-radius:9px}
 .top-tagline{display:none}
 .tabs{position:fixed;left:8px;right:8px;bottom:calc(7px + env(safe-area-inset-bottom));z-index:20;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:0;padding:6px;background:rgba(5,15,26,.96);border:1px solid #2b4660;border-radius:17px;box-shadow:0 12px 38px #0009;backdrop-filter:blur(18px)}
 .tabs:has(.tab:nth-child(5)){grid-template-columns:repeat(5,minmax(0,1fr))}
 .tab{min-width:0;min-height:48px;padding:7px 3px;font-size:10px;line-height:1.15;border-radius:11px;white-space:normal;display:flex;align-items:center;justify-content:center;text-align:center}
 .card{padding:14px;border-radius:15px;margin-bottom:11px}
 .home-hero{padding:16px;min-height:0;background-position:center}
 .home-hero-top{gap:10px}
 .home-hero h2{font-size:25px}
 .home-prize{width:100%;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px}
 .home-prize b{font-size:24px;margin:0}
 .home-metrics{gap:6px;margin-top:12px}
 .home-metric{padding:9px 7px;border-radius:10px}
 .home-metric strong{font-size:14px}
 .home-metric span{font-size:10px;line-height:1.2;display:block}
 .prediction-card{padding:13px}
 .prediction-heading{align-items:flex-start}
 .match{padding:14px 0;gap:9px 6px}
 .match-info .teams{font-size:15px}
 .match-info .kick{font-size:10px}
 .xrow{gap:5px}
 .xrow button{width:42px;min-width:42px;height:43px;flex-basis:42px}
 .score input{width:42px;height:42px}
 .save-bar{bottom:0;padding:12px 0 2px}
 .save-bar .btn{min-height:52px}
 .table{min-width:470px}
 .table th,.table td{padding:10px 8px;font-size:12px}
 .login{margin:10px auto 24px}
 .login-hero{min-height:0;padding:18px 12px}
 .login-logo{width:100%;max-width:360px}
 .loginbox{padding:16px}
 .adminmatch{grid-template-columns:25px minmax(0,1fr) minmax(0,1fr);padding:9px}
 .adminmatch input,.adminmatch select{padding:9px 7px;font-size:14px}
 .formgrid,.formrow{grid-template-columns:1fr}
}

const SUPABASE_URL="https://kprkwwfweuqfghgemkml.supabase.co";
const SUPABASE_KEY="sb_publishable_rmQwmKN3a2T50VD7fpBqhg_5Fd8pNvV";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const state={user:null,profile:null,participant:null,season:null,settings:null,rounds:[],matches:[],predictions:[],scores:[],participants:[],page:"home",adminRound:null,adminTrackingRound:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const money=n=>new Intl.NumberFormat("es-ES").format(Number(n||0))+" €";
const dateFmt=v=>new Date(v).toLocaleString("es-ES",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const isoLocal=v=>new Date(v).toISOString();
function toast(msg){const d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
function admin(){return !!state.profile?.is_admin}
function currentRound(){return [...state.rounds].filter(r=>r.status==="open").sort((a,b)=>new Date(a.first_match_at)-new Date(b.first_match_at))[0]||[...state.rounds].sort((a,b)=>b.round_number-a.round_number)[0]}
function roundMatches(rid){return state.matches.filter(m=>Number(m.round_id)===Number(rid)).sort((a,b)=>a.match_order-b.match_order)}
function resultOutcome(h,a){if(h==null||a==null)return null;return Number(h)>Number(a)?"1":Number(h)<Number(a)?"2":"X"}
function predFor(mid){return state.predictions.find(p=>Number(p.match_id)===Number(mid)&&Number(p.participant_id)===Number(state.participant?.id))}
function scoreRound(rid){return state.scores.find(s=>Number(s.round_id)===Number(rid)&&Number(s.participant_id)===Number(state.participant?.id))}
async function load(){
 const {data:{user}}=await sb.auth.getUser(); state.user=user;
 if(!user){render();return}
 let q=await sb.from("profiles").select("*").eq("id",user.id).single(); if(q.error)throw q.error; state.profile=q.data;
 if(q.data.participant_id){let p=await sb.from("participants").select("*").eq("id",q.data.participant_id).single();if(p.error)throw p.error;state.participant=p.data}
 const [ss,rs,ms,ps,sc,parts]=await Promise.all([
  sb.from("quinielon_seasons").select("*").eq("active",true).maybeSingle(),
  sb.from("quinielon_rounds").select("*").order("round_number"),
  sb.from("quinielon_matches").select("*").order("round_id").order("match_order"),
  sb.from("quinielon_predictions").select("*"),
  sb.from("quinielon_scores").select("*"),
  sb.from("participants").select("*").order("display_order")
 ]);
 for(const x of [ss,rs,ms,ps,sc,parts])if(x.error)throw x.error;
 state.season=ss.data;state.rounds=rs.data||[];state.matches=ms.data||[];state.predictions=ps.data||[];state.scores=sc.data||[];state.participants=parts.data||[];
 if(state.season){let st=await sb.from("quinielon_settings").select("*").eq("season_id",state.season.id).maybeSingle();state.settings=st.data}
 render();
}

async function loginUser(){const team=$("team").value,pass=$("pass").value;$("loginerr").textContent="";if(!team||!pass){$("loginerr").textContent="Selecciona equipo e introduce el código.";return}const {error}=await sb.auth.signInWithPassword({email:emails[team],password:pass});if(error){$("loginerr").textContent="Equipo o código incorrecto.";return}try{await load()}catch(e){await sb.auth.signOut();$("loginerr").textContent=e.message}}
async function loginAdmin(){const email=$("adminemail").value.trim(),password=$("adminpass").value;$("adminerr").textContent="";if(!email||!password){$("adminerr").textContent="Introduce el correo y la contraseña de administrador.";return}const {error}=await sb.auth.signInWithPassword({email,password});if(error){$("adminerr").textContent="No se ha podido iniciar sesión. Comprueba el correo y la contraseña.";return}try{await load();if(!admin()){await sb.auth.signOut();state.user=null;state.profile=null;render();const e=$("adminerr");if(e)e.textContent="Esta cuenta no tiene permisos de administrador."}}catch(e){await sb.auth.signOut();const el=$("adminerr");if(el)el.textContent=e.message}}
async function logout(){await sb.auth.signOut();location.reload()}
function home(){

 const ms=roundMatches(r.id),s=scoreRound(r.id),closed=new Date(r.closes_at)<=new Date(),predCount=ms.filter(m=>!!predFor(m.id)).length;
 return nav()+`<section class="card home-hero"><div class="home-hero-top"><div><span class="badge ${closed?"closed":"open"}">${closed?"🔒 CERRADA":"● JORNADA ABIERTA"}</span><h2>${esc(r.name)}</h2><div class="home-subtitle">${ms.length} partidos · Cierre ${dateFmt(r.closes_at)}</div></div>${s?`<div class="home-prize"><div><span class="small muted">Premio de la jornada</span><b>${money(s.prize)}</b></div><span class="badge open">Calculado</span></div>`:`<div class="home-prize"><div><span class="small muted">Tu premio actual</span><b>— €</b></div><span class="small muted">Aún por calcular</span></div>`}</div><div class="home-metrics"><div class="home-metric"><strong>${predCount}/${ms.length}</strong><span>Pronósticos guardados</span></div><div class="home-metric"><strong>${s?`${s.correct_1x2}/6`:`—/6`}</strong><span>Aciertos 1X2</span></div><div class="home-metric"><strong>${s?`${s.exact_scores}`:"—"}</strong><span>Marcadores exactos</span></div></div></section>
 <section class="card prediction-card"><div class="prediction-heading"><h3>🎯 Tus pronósticos</h3><span class="badge">${ms.length} PARTIDOS</span></div><p class="muted small" style="margin:0 0 8px">Elige 1, X o 2 y añade el marcador exacto. Recuerda guardar antes del cierre.</p>${ms.map(matchHtml).join("")}<div class="save-bar">${closed?`<div class="muted small center">🔒 Los pronósticos están cerrados.</div>`:`<button class="btn primary" onclick="savePredictions(${r.id})">💾 Guardar mis pronósticos</button>`}</div></section>`
}
function matchHtml(m){
 const p=predFor(m.id),locked=new Date(currentRound().closes_at)<=new Date();
 return `<article class="match" data-mid="${m.id}"><div class="match-info"><div><div class="teams">${esc(m.home_team)} <span class="muted">vs</span> ${esc(m.away_team)}</div>${m.status==="finished"?`<div class="ok small">Resultado: ${m.home_goals} - ${m.away_goals}</div>`:""}</div><div class="kick">${dateFmt(m.kickoff_at)}</div></div>
 <div class="match-outcome"><div class="xrow" aria-label="Pronóstico 1X2">${["1","X","2"].map(v=>`<button aria-label="${v}" ${locked?"disabled":""} class="${p?.outcome===v?"sel":""}" data-outcome="${v}" onclick="pickOutcome(${m.id},'${v}',this)">${v}</button>`).join("")}</div></div>
 <div class="score match-score"><input aria-label="Goles de ${esc(m.home_team)}" ${locked?"disabled":""} id="hg_${m.id}" type="number" min="0" max="20" inputmode="numeric" value="${p?.home_goals??""}" placeholder="0"><span class="dash">–</span><input aria-label="Goles de ${esc(m.away_team)}" ${locked?"disabled":""} id="ag_${m.id}" type="number" min="0" max="20" inputmode="numeric" value="${p?.away_goals??""}" placeholder="0"></div></article>`
}
const draft={};
function pickOutcome(mid,v,el){draft[mid]=draft[mid]||{};draft[mid].outcome=v;el.parentElement.querySelectorAll("button").forEach(x=>x.classList.remove("sel"));el.classList.add("sel")}
async function savePredictions(rid){
 const ms=roundMatches(rid),rows=[];for(const m of ms){const old=predFor(m.id),d=draft[m.id]||{},out=d.outcome||old?.outcome,h=$(("hg_"+m.id)),a=$(("ag_"+m.id));if(!out||h.value===""||a.value===""){toast("Completa los 6 pronósticos.");return}rows.push({participant_id:state.participant.id,match_id:m.id,outcome:out,home_goals:Number(h.value),away_goals:Number(a.value)})}
 const {error}=await sb.from("quinielon_predictions").upsert(rows,{onConflict:"participant_id,match_id"});if(error){toast(error.message);return}toast("Pronósticos guardados.");await load()
}
function ranking(){
 const rows=state.participants.map(p=>{const ss=state.scores.filter(s=>Number(s.participant_id)===Number(p.id));return {...p,total:ss.reduce((a,s)=>a+Number(s.prize||0),0),one:ss.reduce((a,s)=>a+Number(s.correct_1x2||0),0),exact:ss.reduce((a,s)=>a+Number(s.exact_scores||0),0),full:ss.filter(s=>s.full_bonus).length}}).sort((a,b)=>b.total-a.total);
 return nav()+`<div class="card"><h2>🏆 Clasificación general</h2><div class="tablewrap"><table class="table"><thead><tr><th>#</th><th>Equipo</th><th>€</th><th>1X2</th><th>Exactos</th><th>6/6</th></tr></thead><tbody>${rows.map((x,i)=>`<tr class="${Number(x.id)===Number(state.participant?.id)?"me":""}"><td>${i+1}</td><td><b>${esc(x.team_name||x.name||"Equipo")}</b></td><td><b>${money(x.total)}</b></td><td>${x.one}</td><td>${x.exact}</td><td>${x.full}</td></tr>`).join("")}</tbody></table></div></div>
 <div class="card"><h3>📅 Clasificación por jornada</h3>${state.rounds.filter(r=>r.status==="finished").reverse().map(r=>{const rr=state.scores.filter(s=>Number(s.round_id)===Number(r.id)).sort((a,b)=>b.prize-a.prize);return `<h4>${esc(r.name)}</h4><div class="tablewrap"><table class="table"><tbody>${rr.map((s,i)=>{const p=state.participants.find(x=>Number(x.id)===Number(s.participant_id));return `<tr><td>${i+1}</td><td>${esc(p?.team_name||p?.name||"")}</td><td>${s.correct_1x2}/6</td><td>${s.exact_scores}</td><td><b>${money(s.prize)}</b></td></tr>`}).join("")}</tbody></table></div>`}).join("")||`<p class="muted">Todavía no hay jornadas finalizadas.</p>`}</div>`
}
function history(){
 const me=state.scores.filter(s=>Number(s.participant_id)===Number(state.participant?.id)).sort((a,b)=>{const ra=state.rounds.find(r=>r.id===a.round_id),rb=state.rounds.find(r=>r.id===b.round_id);return (rb?.round_number||0)-(ra?.round_number||0)});
 return nav()+`<div class="card"><h2>📊 Historial de ${esc(state.participant?.team_name||"")}</h2><div class="tablewrap"><table class="table"><thead><tr><th>Jornada</th><th>1X2</th><th>Exactos</th><th>6/6</th><th>Premio</th></tr></thead><tbody>${me.map(s=>{const r=state.rounds.find(x=>Number(x.id)===Number(s.round_id));return `<tr><td>${esc(r?.name||"")}</td><td>${s.correct_1x2}/6</td><td>${s.exact_scores}</td><td>${s.full_bonus?"🏆":""}</td><td><b>${money(s.prize)}</b></td></tr>`}).join("")||`<tr><td colspan="5">Aún no hay jornadas puntuadas.</td></tr>`}</tbody></table></div></div>`
}
function adminPage(){
 const rounds=[...state.rounds].sort((a,b)=>b.round_number-a.round_number);
 return nav()+`<div class="grid"><div class="card"><h2>⚙️ Nueva jornada</h2><div class="formgrid"><div><label>Nº jornada</label><input id="nr" type="number" min="1"></div><div><label>Nombre</label><input id="nn" placeholder="Jornada 1"></div><div><label>Cierre</label><input id="nc" type="datetime-local"></div></div><p class="small muted">Puedes dejar el cierre vacío: se calculará automáticamente como 1 hora antes del primer partido.</p><div id="newmatches">${adminMatchRows()}</div><div style="margin-top:12px"><button class="btn blue" onclick="importFile()">📥 Importar CSV/JSON</button> <input id="file" type="file" accept=".csv,.json" class="hidden" onchange="readImport(event)"></div><button class="btn primary" style="margin-top:12px" onclick="createRound()">💾 Crear jornada</button></div>
 <div class="card"><h2>📚 Jornadas</h2>${rounds.map(r=>`<div class="stat" style="margin-bottom:9px"><b>${esc(r.name)}</b><span class="badge ${r.status}">${r.status}</span><div class="small muted">Cierre ${dateFmt(r.closes_at)}</div><button class="btn" style="margin-top:8px" onclick="openAdminRound(${r.id})">Gestionar</button> <button class="btn blue" style="margin-top:8px" onclick="openAdminTracking(${r.id})">👥 Seguimiento</button></div>`).join("")||`<p class="muted">No hay jornadas.</p>`}</div></div>
 ${state.adminRound?adminManage(state.adminRound):""}
 ${state.adminTrackingRound?adminTracking(state.adminTrackingRound):""}`
}
function adminMatchRows(data){return Array.from({length:6},(_,i)=>{const m=data?.[i]||{};return `<div class="adminmatch"><b>${i+1}</b><div><label>Local</label><input id="ml_${i}" value="${esc(m.home_team||"")}"></div><div><label>Visitante</label><input id="ma_${i}" value="${esc(m.away_team||"")}"></div><div><label>Inicio</label><input id="mk_${i}" type="datetime-local" value="${m.kickoff_at?new Date(m.kickoff_at).toISOString().slice(0,16):""}"></div><div><label>Goles L</label><input id="gh_${i}" type="number" min="0" value="${m.home_goals??""}"></div><div><label>Goles V</label><input id="ga_${i}" type="number" min="0" value="${m.away_goals??""}"></div></div>`}).join("")}
function importFile(){ $("file").click() }
async function readImport(e){const f=e.target.files[0];if(!f)return;const txt=await f.text();try{let data;if(f.name.toLowerCase().endsWith(".json")){const j=JSON.parse(txt);$("nr").value=j.jornada||"";$("nn").value=j.nombre||`Jornada ${j.jornada||""}`;$("nc").value=j.cierre?new Date(j.cierre).toISOString().slice(0,16):"";data=j.partidos}else{const lines=txt.trim().split(/\r?\n/).map(x=>x.split(","));const head=lines.shift();data=lines.map(x=>({orden:x[0],local:x[1],visitante:x[2],inicio:x[3]}))}data=data.slice(0,6);data.forEach((m,i)=>{ $("ml_"+i).value=m.local||"";$("ma_"+i).value=m.visitante||"";$("mk_"+i).value=new Date(m.inicio).toISOString().slice(0,16)});toast("Fichero cargado. Revisa los datos y crea la jornada.");}catch(err){toast("No he podido leer el fichero.")}}
async function createRound(){
 if(!admin())return;const num=Number($("nr").value),name=$("nn").value.trim()||`Jornada ${num}`,matches=[];for(let i=0;i<6;i++){const h=$("ml_"+i).value.trim(),a=$("ma_"+i).value.trim(),k=$("mk_"+i).value;if(!h||!a||!k){toast("Completa los 6 partidos.");return}matches.push({home_team:h,away_team:a,kickoff_at:isoLocal(k)})}
 let close=$("nc").value?isoLocal($("nc").value):null;if(!close)close=new Date(Math.min(...matches.map(x=>new Date(x.kickoff_at).getTime()))-3600000).toISOString();
 const first=matches.reduce((a,b)=>new Date(a.kickoff_at)<new Date(b.kickoff_at)?a:b);
 let q=await sb.from("quinielon_rounds").insert({season_id:state.season.id,round_number:num,name,status:"draft",closes_at:close,first_match_at:first.kickoff_at,created_by:state.user.id}).select().single();if(q.error){toast(q.error.message);return}
 const rows=matches.map((m,i)=>({...m,round_id:q.data.id,match_order:i+1}));let z=await sb.from("quinielon_matches").insert(rows);if(z.error){toast(z.error.message);return}
 toast("Jornada creada como borrador.");state.adminRound=q.data.id;await load()
}
function adminManage(rid){
 const r=state.rounds.find(x=>Number(x.id)===Number(rid)),ms=roundMatches(rid);if(!r)return "";
 return `<div class="card"><h2>🛠️ ${esc(r.name)}</h2><p><span class="badge ${r.status}">${r.status}</span> · cierre ${dateFmt(r.closes_at)}</p>
 ${ms.map(m=>`<div class="adminmatch"><b>${m.match_order}</b><div><label>${esc(m.home_team)}</label></div><div><label>${esc(m.away_team)}</label></div><div><label>Estado</label><select id="st_${m.id}"><option ${m.status==="scheduled"?"selected":""}>scheduled</option><option ${m.status==="finished"?"selected":""}>finished</option><option ${m.status==="postponed"?"selected":""}>postponed</option><option ${m.status==="cancelled"?"selected":""}>cancelled</option></select></div><div><label>Local</label><input id="rh_${m.id}" type="number" min="0" value="${m.home_goals??""}"></div><div><label>Visit.</label><input id="ra_${m.id}" type="number" min="0" value="${m.away_goals??""}"></div></div>`).join("")}
 <div style="margin-top:15px"><button class="btn green" onclick="saveResults(${r.id})">💾 Guardar resultados y calcular</button> ${r.status==="draft"?`<button class="btn primary" onclick="publishRound(${r.id})">🚀 Publicar jornada</button>`:""} ${r.status!=="finished"?`<button class="btn" onclick="finishRound(${r.id})">🏁 Marcar finalizada</button>`:""}</div></div>`
}
function openAdminTracking(rid){state.page="admin";state.adminRound=null;state.adminTrackingRound=rid;render()}
function adminTracking(rid){
 const r=state.rounds.find(x=>Number(x.id)===Number(rid));if(!r)return "";
 const ms=roundMatches(rid);const expected=ms.length;
 const rows=state.participants.map(p=>{const pp=state.predictions.filter(x=>Number(x.participant_id)===Number(p.id)&&ms.some(m=>Number(m.id)===Number(x.match_id)));const count=new Set(pp.map(x=>Number(x.match_id))).size;const status=count===expected&&expected>0?"Completa":count>0?"Incompleta":"Pendiente";const msg=`Hola ${p.team_name||p.name||""} 👋, acuérdate de hacer la quiniela de ${r.name}. Llevas ${count} de ${expected} partidos pronosticados. El plazo termina el ${dateFmt(r.closes_at)}. ¡Que no se te pase! ⚽`;
 const badge=count===expected&&expected>0?`<span class="badge open">✅ Completa</span>`:count>0?`<span class="badge draft">🟠 Incompleta</span>`:`<span class="badge finished">❌ Pendiente</span>`;
 const link=`https://wa.me/?text=${encodeURIComponent(msg)}`;
 return {p,count,status,badge,link,msg};}).sort((a,b)=>a.count-b.count||String(a.p.team_name||a.p.name).localeCompare(String(b.p.team_name||b.p.name)));
 const done=rows.filter(x=>x.count===expected&&expected>0).length,pending=rows.filter(x=>x.count===0).length,partial=rows.filter(x=>x.count>0&&x.count<expected).length;
 return `<div class="card"><h2>👥 Seguimiento de pronósticos · ${esc(r.name)}</h2><p class="muted small">Se considera completa una quiniela cuando hay un pronóstico guardado para todos los partidos de la jornada (${expected}). Este panel no muestra las selecciones realizadas.</p><div class="grid3"><div class="stat"><span>Completas</span><b>${done}</b></div><div class="stat"><span>Incompletas</span><b>${partial}</b></div><div class="stat"><span>Sin empezar</span><b>${pending}</b></div></div><div class="tablewrap"><table class="table"><thead><tr><th>Equipo</th><th>Estado</th><th>Partidos</th><th>Recordatorio</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.p.team_name||x.p.name||"Equipo")}</b></td><td>${x.badge}</td><td>${x.count}/${expected}</td><td>${x.count<expected?`<a class="btn blue" href="${x.link}" target="_blank" rel="noopener">WhatsApp</a>`:`<span class="muted small">—</span>`}</td></tr>`).join("")}</tbody></table></div><button class="btn" style="margin-top:12px" onclick="state.adminTrackingRound=null;render()">Cerrar seguimiento</button></div>`
}
async function publishRound(rid){let q=await sb.from("quinielon_rounds").update({status:"open",published_at:new Date().toISOString()}).eq("id",rid);if(q.error){toast(q.error.message);return}toast("Jornada publicada.");state.adminRound=rid;await load()}
async function saveResults(rid){
 const ms=roundMatches(rid);for(const m of ms){const h=$("rh_"+m.id).value,a=$("ra_"+m.id).value,st=$("st_"+m.id).value;if(h===""||a==="")continue;let q=await sb.from("quinielon_matches").update({home_goals:Number(h),away_goals:Number(a),status:st,result_source:"admin",result_confirmed_at:new Date().toISOString()}).eq("id",m.id);if(q.error){toast(q.error.message);return}}
 await calculate(rid);toast("Resultados guardados y puntuaciones recalculadas.");await load()
}
async function calculate(rid){
 const ms=roundMatches(rid),pred=state.predictions.filter(p=>ms.some(m=>Number(m.id)===Number(p.match_id))),settings=state.settings||{prize_1x2:100000,prize_exact:250000,prize_full:1000000};
 for(const part of state.participants){
   const pp=pred.filter(p=>Number(p.participant_id)===Number(part.id));let one=0,exact=0;
   for(const m of ms){const p=pp.find(x=>Number(x.match_id)===Number(m.id));if(!p||m.home_goals==null)continue;const real=resultOutcome(m.home_goals,m.away_goals);if(p.outcome===real)one++;if(Number(p.home_goals)===Number(m.home_goals)&&Number(p.away_goals)===Number(m.away_goals))exact++}
   const full=one===6,prize=one*Number(settings.prize_1x2)+exact*Number(settings.prize_exact)+(full?Number(settings.prize_full):0);
   await sb.from("quinielon_scores").upsert({round_id:rid,participant_id:part.id,correct_1x2:one,exact_scores:exact,full_bonus:full,prize,calculated_at:new Date().toISOString()},{onConflict:"round_id,participant_id"})
 }
}
async function finishRound(rid){await calculate(rid);let q=await sb.from("quinielon_rounds").update({status:"finished"}).eq("id",rid);if(q.error){toast(q.error.message);return}toast("Jornada finalizada.");state.adminRound=rid;await load()}
function render(){const app=$("app");if(!state.user){app.innerHTML=login();return}if(state.page==="home")app.innerHTML=home();else if(state.page==="ranking")app.innerHTML=ranking();else if(state.page==="history")app.innerHTML=history();else app.innerHTML=admin()?adminPage():home()}
function go(p){state.page=p;state.adminRound=null;state.adminTrackingRound=null;render()}
function openAdminRound(id){state.page="admin";state.adminRound=id;render()}
sb.auth.onAuthStateChange((event)=>{if(event==="SIGNED_IN")load().catch(e=>toast(e.message))});
load().catch(e=>{console.error(e);toast(e.message||"Error al cargar")});
</script>
</body>
</html>
